services:
  - type: web
    name: airbnb-menage-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: airbnb-menage-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: LOGIN_WINDOW_SECONDS
        value: "60"
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: UPLOAD_DIR
        value: /app/app/uploads

databases:
  - name: airbnb-menage-db
    plan: free
