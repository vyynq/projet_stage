services:
  - type: web
    name: airbnb-menage-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: airbnb-menage-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: LOGIN_WINDOW_SECONDS
        value: "60"
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: UPLOAD_DIR
        value: /app/app/uploads
      - key: EMAIL_DELIVERY_MODE
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "true"

databases:
  - name: airbnb-menage-db
    plan: free
